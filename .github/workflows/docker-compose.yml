name: Docker Compose startup

on:
  pull_request:
  workflow_dispatch:

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
      DEEPSEEK_API_KEY: compose-startup-placeholder
      DASHSCOPE_API_KEY: compose-startup-placeholder
      DASHSCOPE_BASE_URL: https://ci.example.test/compatible-mode/v1
      SKYSUN_ADMIN_TOKEN: compose-startup-placeholder-12345678901234567890
      SKYSUN_PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach
      - name: Check frontend, SPA routing, and API proxy
        run: |
          curl --fail --show-error --silent http://127.0.0.1:8080/ --output /tmp/skysun-index.html
          grep -q '<div id="root"></div>' /tmp/skysun-index.html
          curl --fail --show-error --silent http://127.0.0.1:8080/chat --output /tmp/skysun-chat.html
          cmp /tmp/skysun-index.html /tmp/skysun-chat.html
          curl --fail --show-error http://127.0.0.1:8080/api/health
      - name: Check device WebSocket through Nginx
        run: |
          docker compose exec -T backend python - <<'PY'
          import json
          import os
          import base64
          from urllib.request import Request, urlopen
          from websockets.sync.client import connect

          bearer = "Bearer " + os.environ["SKYSUN_ADMIN_TOKEN"]
          request = Request("http://frontend/api/devices", method="POST",
                            headers={"Authorization": bearer, "Content-Type": "application/json"},
                            data=json.dumps({"name": "CI computer", "hostname": "runner",
                                             "operating_system": "Linux"}).encode())
          with urlopen(request) as response:
              device = json.load(response)
          with connect("ws://frontend/api/ws/devices/" + device["device_id"],
                       additional_headers={"Authorization": "Bearer " + device["device_token"]}) as ws:
              assert json.loads(ws.recv())["type"] == "connected"
              ws.send(json.dumps({"type": "heartbeat", "cpu_percent": 1,
                                  "memory_percent": 2, "disk_percent": 3,
                                  "project_name": "SkySun", "git_branch": "main",
                                  "git_modified_count": 1}))
              assert json.loads(ws.recv())["type"] == "heartbeat_ack"
              with urlopen(Request("http://frontend/api/devices",
                                   headers={"Authorization": bearer})) as response:
                  devices = json.load(response)
              assert devices[0]["online"] and devices[0]["cpu_percent"] == 1
              assert devices[0]["project_name"] == "SkySun"
              base = "http://frontend/api/devices/" + device["device_id"]
              with urlopen(Request(base + "/screenshots", method="POST",
                                   headers={"Authorization": bearer}, data=b"")) as response:
                  screenshot = json.load(response)
              ws.send(json.dumps({"type": "heartbeat", "cpu_percent": 1,
                                  "memory_percent": 2, "disk_percent": 3}))
              assert json.loads(ws.recv())["type"] == "heartbeat_ack"
              assert json.loads(ws.recv())["request_id"] == screenshot["request_id"]
              image = base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/JXcAAAAASUVORK5CYII=")
              upload = base + "/screenshots/" + screenshot["request_id"] + "/upload"
              with urlopen(Request(upload, method="POST", data=image,
                                   headers={"Authorization": "Bearer " + device["device_token"],
                                            "Content-Type": "image/png"})) as response:
                  assert json.load(response)["status"] == "COMPLETED"
              with urlopen(Request("http://frontend/api/screenshots/" + screenshot["request_id"] + "/image",
                                   headers={"Authorization": bearer})) as response:
                  assert response.read() == image
              with urlopen(Request(base + "/notes", method="POST",
                                   headers={"Authorization": bearer, "Content-Type": "application/json"},
                                   data=b'{"content":"CI reminder"}')) as response:
                  note = json.load(response)
              ws.send(json.dumps({"type": "heartbeat", "cpu_percent": 1,
                                  "memory_percent": 2, "disk_percent": 3}))
              assert json.loads(ws.recv())["type"] == "heartbeat_ack"
              assert json.loads(ws.recv())["note_id"] == note["note_id"]
          PY
      - name: Show service status on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=150
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
