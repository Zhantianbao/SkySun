[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skysun"
version = "1.7.1"
description = "SkySun personal AI agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
    "websockets>=14,<17",
    "langchain>=1,<2",
    "langchain-deepseek>=1,<2",
    "pydantic-settings>=2,<3",
    "psycopg>=3.2,<4",
    "pgvector>=0.4,<1",
    "langchain-openai>=1.7.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "psutil>=5.9,<8",
    "websockets>=14,<17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skysun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
